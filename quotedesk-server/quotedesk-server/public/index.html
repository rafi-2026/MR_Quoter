  <style>
    :root {
      --ink: #1b2a2f;
      --ink2: #3f5258;
      --mute: #6c7f85;
      --paper: #f3f5f4;
      --card: #fff;
      --line: #d7dedc;
      --line2: #e8edeb;
      --glass: #2a7880;
      --glass-d: #1d5a61;
      --glass-l: #e2f0f0;
      --bronze: #a46a2a;
      --bronze-l: #f5e9d8;
      --ok: #2c7a4b;
      --ok-l: #dff1e6;
      --warn: #a96f12;
      --warn-l: #fbefd3;
      --bad: #b03a3a;
      --bad-l: #f8e0e0;
      --blue: #2b5c9e;
      --blue-l: #e0eaf7;
      --r: 6px;
    }

    * {
      box-sizing: border-box
    }

    html {
      font-size: 15px
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: .01em
    }

    h1 {
      font-size: 1.65rem;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    h2 {
      font-size: 1.2rem
    }

    h3 {
      font-size: 1.05rem
    }

    h4 {
      font-size: .95rem;
      margin: 16px 0 8px
    }

    a {
      color: var(--glass-d)
    }

    .mute {
      color: var(--mute)
    }

    .sm {
      font-size: .86rem
    }

    .r {
      text-align: right
    }

    .nowrap {
      white-space: nowrap
    }

    .sp {
      flex: 1
    }

    /* shell */
    .app {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh
    }

    .side-nav {
      background: linear-gradient(160deg, #0d2137 0%, #1a3a52 40%, #0e4a4a 100%);
      color: #d6e2e4;
      display: flex;
      flex-direction: column;
      padding: 18px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      box-shadow: 3px 0 15px rgba(0,0,0,.3)
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0 18px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .15)
    }

    .mono {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f4a04a, #e07020);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Sans Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      flex: none;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(244,160,74,.4)
    }

    .mono img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff
    }

    .brand b {
      display: block;
      color: #fff;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: .02em
    }

    .brand span {
      font-size: .75rem;
      color: #a8c8ce
    }

    .nav {
      padding: 12px 8px;
      flex: 1
    }

    .nav a {
      display: flex;
      align-items: center;
      padding: .55rem .85rem;
      border-radius: 7px;
      color: #b8d4d8;
      text-decoration: none;
      margin-bottom: 3px;
      border-left: 3px solid transparent;
      transition: all .18s ease;
      font-size: .92rem
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .09);
      color: #fff;
      padding-left: 1.1rem
    }

    .nav a.on {
      background: linear-gradient(90deg, rgba(244,160,74,.22), rgba(244,160,74,.08));
      color: #fff;
      border-left-color: #f4a04a;
      font-weight: 600
    }

    .me {
      padding: 12px 18px 6px;
      border-top: 1px solid rgba(255, 255, 255, .12);
      font-size: .86rem;
      background: rgba(0,0,0,.15)

    .me b {
      color: #fff;
      display: block
    }

    .me .role {
      color: #a8c8ce;
      font-size: .78rem;
      margin-top: 1px;
      display: block
    }

    .me button {
      background: none;
      border: 0;
      color: #8fa6ab;
      padding: 0;
      margin: 6px 8px 0 0;
      cursor: pointer;
      font: inherit;
      font-size: .8rem;
      text-decoration: underline
    }

    .me button:hover {
      color: #fff
    }

    .main {
      padding: 26px 30px 60px;
      min-width: 0
    }

    .ph {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    @media(max-width:860px) {
      .app {
        grid-template-columns: 1fr
      }

      .side-nav {
        position: static;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 10px 12px;
        gap: 6px
      }

      .brand {
        border: 0;
        padding: 0 12px 0 0
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        padding: 0;
        flex: 1
      }

      .nav a {
        border-left: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0
      }

      .nav a.on {
        border-bottom-color: var(--bronze)
      }

      .me {
        border: 0;
        padding: 0
      }

      .main {
        padding: 18px 14px 50px
      }
    }

    /* basics */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px;
      margin-bottom: 16px
    }

    .card>h3 {
      margin-bottom: 12px
    }

    .card-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .btn {
      font: inherit;
      font-weight: 500;
      padding: .5rem .95rem;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .btn:hover {
      border-color: var(--glass);
      color: var(--glass-d)
    }

    .btn.pri {
      background: var(--glass);
      border-color: var(--glass);
      color: #fff
    }

    .btn.pri:hover {
      background: var(--glass-d);
      border-color: var(--glass-d);
      color: #fff
    }

    .btn.warn {
      background: var(--bronze);
      border-color: var(--bronze);
      color: #fff
    }

    .btn.warn:hover {
      filter: brightness(.92);
      color: #fff
    }

    .btn.bad {
      color: var(--bad)
    }

    .btn.bad:hover {
      border-color: var(--bad);
      color: var(--bad)
    }

    .btn.sm {
      padding: .28rem .6rem;
      font-size: .86rem
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent
    }

    .btn.ghost:hover {
      background: var(--line2)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    :focus-visible {
      outline: 2px solid var(--glass);
      outline-offset: 1px
    }

    label.f {
      display: block;
      font-size: .84rem;
      color: var(--ink2);
      font-weight: 500
    }

    label.f>span {
      display: block;
      margin-bottom: 3px
    }

    label.chk {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: .92rem
    }

    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
      width: 100%;
      padding: .46rem .6rem;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      min-width: 0
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--glass)
    }

    input:disabled,
    select:disabled,
    textarea:disabled {
      background: #f1f4f3;
      color: var(--ink2)
    }

    input[type=checkbox] {
      width: auto
    }

    textarea {
      resize: vertical;
      min-height: 72px
    }

    .grid {
      display: grid;
      gap: 12px
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    @media(max-width:760px) {

      .g2,
      .g3,
      .g4 {
        grid-template-columns: 1fr
      }
    }

    .tbl {
      width: 100%;
      border-collapse: collapse
    }

    .tbl th {
      text-align: left;
      font-weight: 500;
      color: var(--mute);
      font-size: .84rem;
      padding: .5rem .6rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    .tbl td {
      padding: .6rem;
      border-bottom: 1px solid var(--line2);
      vertical-align: top
    }

    .tbl tbody tr:hover td {
      background: #fafcfb
    }

    .tbl .r {
      text-align: right
    }

    .tbl a.rl {
      font-weight: 500;
      text-decoration: none
    }

    .tbl a.rl:hover {
      text-decoration: underline
    }

    .scx {
      overflow-x: auto
    }

    .bd {
      display: inline-block;
      padding: .1rem .55rem;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 500;
      white-space: nowrap;
      font-family: "IBM Plex Sans", sans-serif;
      letter-spacing: 0
    }

    .bd.draft {
      background: #e9eeed;
      color: #4a5d63
    }

    .bd.pending {
      background: var(--warn-l);
      color: var(--warn)
    }

    .bd.approved {
      background: var(--glass-l);
      color: var(--glass-d)
    }

    .bd.rejected {
      background: var(--bad-l);
      color: var(--bad)
    }

    .bd.sent {
      background: var(--blue-l);
      color: var(--blue)
    }

    .bd.won {
      background: var(--ok-l);
      color: var(--ok)
    }

    .bd.lost {
      background: #eceaea;
      color: #7a6a6a
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      font: inherit;
      font-size: .86rem;
      padding: .25rem .7rem;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      color: var(--ink2);
      text-decoration: none
    }

    .chip:hover {
      border-color: var(--glass)
    }

    .chip.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .chip b {
      font-weight: 600;
      margin-left: 4px
    }

    .tools {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .tools input[type=search] {
      max-width: 280px
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--mute);
      border: 1px dashed var(--line);
      border-radius: 6px;
      background: #fff
    }

    .note {
      background: var(--bronze-l);
      border: 1px solid #e6cfa8;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: .9rem
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px
    }

    @media(max-width:900px) {
      .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    .kpi {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px 16px
    }

    .kpi small {
      color: var(--mute);
      display: block;
      font-size: .84rem
    }

    .kpi b {
      font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
      font-size: 1.65rem;
      font-weight: 600;
      display: block;
      margin-top: 2px
    }

    .kpi span {
      font-size: .82rem;
      color: var(--mute)
    }

    .two {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 16px
    }

    @media(max-width:1000px) {
      .two {
        grid-template-columns: 1fr
      }
    }

    /* modal + toast */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(20, 32, 36, .5);
      display: grid;
      place-items: center;
      z-index: 50;
      padding: 16px
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      width: min(520px, 100%);
      max-height: 92vh;
      display: flex;
      flex-direction: column
    }

    .modal.wide {
      width: min(720px, 100%)
    }

    .modal-h {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .modal-b {
      padding: 18px 20px;
      overflow: auto
    }

    .modal-f {
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: .65rem 1.1rem;
      border-radius: 6px;
      z-index: 80;
      max-width: min(560px, 92vw);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .25)
    }

    .toast.bad {
      background: var(--bad)
    }

    /* Motion & Smooth Interaction Enhancements */
    html {
      scroll-behavior: smooth;
    }
    .ov {
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: background-color 0.25s ease;
    }
    .modal {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.05);
      will-change: transform, opacity;
      transform-origin: center center;
    }
    .toast {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      will-change: transform, opacity;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .card, .kpi-card, .stat-card, .table-wrap {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, box-shadow;
    }
    .card:hover, .stat-card:hover {
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.08);
    }
    button, .btn {
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.16s ease, filter 0.16s ease;
      will-change: transform;
    }
    button:active, .btn:active {
      transform: scale(0.96) !important;
    }
    .nav a {
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }
    .nav a:active {
      transform: scale(0.98);
    }
    table tbody tr {
      transition: background-color 0.15s ease;
    }
    .main {
      will-change: opacity, transform;
    }

    /* auth - centered glassmorphic card with animated background */
    .auth-wrap {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--theme-bg, linear-gradient(135deg, #090e1c 0%, #151b30 50%, #0d1222 100%));
      overflow: hidden;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      transition: background 0.8s ease;
    }

    /* Animated architectural blueprint drafting grid */
    .auth-grid-bg {
      position: absolute;
      inset: 0;
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse at 50% 50%, #000 60%, transparent 95%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 60%, transparent 95%);
      pointer-events: none;
      z-index: 1;
      animation: gridDrift 45s linear infinite;
    }

    @keyframes gridDrift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(25px, 25px); }
      100% { transform: translate(0, 0); }
    }

    .auth-bg-orbs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.6;
      animation: orbFloat 20s ease-in-out infinite alternate;
      transition: background 1s ease;
    }

    .orb1 {
      width: 440px;
      height: 440px;
      background: var(--theme-orb1, radial-gradient(circle, #0284c7 0%, #0369a1 100%));
      top: -120px;
      left: -100px;
    }

    .orb2 {
      width: 480px;
      height: 480px;
      background: var(--theme-orb2, radial-gradient(circle, #f59e0b 0%, #b45309 100%));
      bottom: -150px;
      right: -100px;
      animation-delay: -7s;
    }

    .orb3 {
      width: 340px;
      height: 340px;
      background: var(--theme-orb3, radial-gradient(circle, #7c3aed 0%, #4338ca 100%));
      top: 35%;
      right: 15%;
      animation-delay: -14s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, 35px) scale(1.08); }
      100% { transform: translate(-35px, -45px) scale(0.95); }
    }

    /* Daily Theme Switcher Badge in Top Corner */
    .auth-theme-pill {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 50;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }
    .auth-theme-pill:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .auth-card {
      position: relative;
      z-index: 10;
      width: min(460px, 100%);
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 34px 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    /* Modern Login Tabs */
    .auth-tabs {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .auth-tab {
      flex: 1;
      padding: 8px 12px;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 600;
      color: #64748b;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* AI Diagnostic Card inside Auth */
    .ai-diag-card {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #166534;
      animation: fadeIn 0.3s ease;
    }
    .ai-diag-card.error-mode {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .ai-diag-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 0.88rem;
    }

    /* Floating AI Co-Pilot FAB */
    .ai-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .ai-fab:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.55);
    }
    .ai-fab-pulse {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseGlow 1.8s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0
    }

    .auth-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a7880, #a46a2a);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Sans Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(42, 120, 128, 0.3)
    }

    .auth-title-box h2 {
      font-size: 1.15rem;
      color: #0f172a;
      margin: 0;
      line-height: 1.2
    }

    .auth-title-box span {
      font-size: 0.8rem;
      color: #64748b
    }

    .auth-card-head {
      margin-bottom: 18px
    }

    .auth-card-head h1 {
      font-size: 1.4rem;
      color: #0f172a;
      margin-bottom: 3px
    }

    .auth-card form {
      display: flex;
      flex-direction: column;
      gap: 15px
    }

    .auth-card label.f span {
      color: #334155;
      font-weight: 600;
      font-size: 0.85rem
    }

    .auth-card input {
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.95rem;
      transition: all 0.2s ease
    }

    .auth-card input:focus {
      background: #fff;
      border-color: #2a7880;
      box-shadow: 0 0 0 3px rgba(42, 120, 128, 0.15)
    }

    .auth-card button.btn.pri {
      padding: 0.7rem 1rem;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 8px;
      background: linear-gradient(135deg, #2a7880, #1d5a61);
      box-shadow: 0 4px 14px rgba(42, 120, 128, 0.35);
      margin-top: 4px
    }

    .auth-card button.btn.pri:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 18px rgba(42, 120, 128, 0.45)
    }

    .auth-footer-credit {
      position: relative;
      z-index: 10;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      letter-spacing: 0.02em
    }

    .auth-footer-credit b {
      color: #e2e8f0
    }

    .auth-footer-credit a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500
    }

    .auth-footer-credit a:hover {
      text-decoration: underline
    }

    /* quote editor */
    .qg {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start
    }

    .qside {
      position: sticky;
      top: 16px
    }

    @media(max-width:1150px) {
      .qg {
        grid-template-columns: 1fr
      }

      .qside {
        position: static
      }
    }

    .ln {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      margin-bottom: 10px
    }

    .ln-h {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line2);
      background: #fafcfb;
      border-radius: 6px 6px 0 0;
      flex-wrap: wrap
    }

    .ln-n {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: .8rem;
      flex: none
    }

    .ln-h .tag {
      width: 96px
    }

    .ln-h .loc {
      flex: 1;
      min-width: 150px
    }

    .ln-c {
      display: flex;
      gap: 2px;
      flex-wrap: wrap
    }

    .ln-b {
      padding: 12px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 12px
    }

    .ln-b.one {
      grid-template-columns: minmax(0, 1fr)
    }

    .ln-f {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px
    }

    .ln-f .s2 {
      grid-column: span 2
    }

    .ln-f .s3 {
      grid-column: span 3
    }

    .ln-f .s6 {
      grid-column: span 6
    }

    @media(max-width:700px) {
      .ln-f {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .ln-f .s2,
      .ln-f .s3 {
        grid-column: span 2
      }

      .ln-f .s6 {
        grid-column: span 2
      }

      .ln-b {
        grid-template-columns: 1fr
      }
    }

    .ln-calc {
      grid-column: 1/-1;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      font-size: .86rem;
      color: var(--ink2);
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      margin-top: 2px;
      align-items: baseline
    }

    .ln-calc b {
      color: var(--ink);
      font-weight: 600
    }

    .ln-calc .amt {
      margin-left: auto;
      font-size: 1.02rem
    }

    .ln.sec {
      background: var(--glass-l);
      border-color: #bcd9db
    }

    .ln.sec .ln-h {
      background: transparent;
      border: 0
    }

    .ln.sec input {
      font-weight: 600
    }

    .glyph {
      display: block
    }

    .glyph .gf {
      fill: #fff;
      stroke: #1b2a2f;
      stroke-width: 1.5
    }

    .glyph .gg {
      fill: #d9eaec;
      stroke: #1b2a2f;
      stroke-width: .9
    }

    .glyph line,
    .glyph polyline {
      stroke: #1b2a2f;
      stroke-width: .9;
      fill: none
    }

    .row2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center
    }

    .tot {
      width: 100%;
      border-collapse: collapse
    }

    .tot td {
      padding: .3rem 0
    }

    .tot td.r {
      text-align: right
    }

    .tot .gt td {
      border-top: 2px solid var(--ink);
      font-weight: 600;
      font-size: 1.12rem;
      padding-top: .55rem
    }

    .hist {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: .88rem
    }

    .hist li {
      padding: .45rem 0;
      border-bottom: 1px solid var(--line2);
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center
    }

    .hist li:last-child {
      border: 0
    }

    .hist small {
      color: var(--mute);
      display: block
    }

    /* preview + printable document */
    #preview {
      position: fixed;
      inset: 0;
      background: #46595f;
      z-index: 60;
      overflow: auto;
      display: none
    }

    #preview.on {
      display: block
    }

    .pv-bar {
      position: sticky;
      top: 0;
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 2;
      flex-wrap: wrap
    }

    .pv-bar small {
      color: #9fb4b8
    }

    .sheet {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto;
      padding: 13mm 13mm 15mm;
      box-shadow: 0 2px 14px rgba(0, 0, 0, .35);
      color: #1b2a2f
    }

    @media(max-width:820px) {
      .sheet {
        width: auto;
        margin: 0;
        padding: 14px;
        min-height: 0
      }
    }

    .doc {
      font-size: 9.5pt;
      line-height: 1.4
    }

    .doc h1 {
      font-size: 21pt;
      letter-spacing: .03em;
      display: block
    }

    .doc-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 2px solid #1b2a2f;
      padding-bottom: 10px
    }

    .doc-co {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .doc-co img {
      height: 52px;
      max-width: 130px;
      object-fit: contain
    }

    .doc-co b {
      font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
      font-size: 14pt;
      display: block;
      line-height: 1.2
    }

    .doc-co div {
      font-size: 8.5pt;
      color: #3f5258
    }

    .doc-meta {
      text-align: right
    }

    .doc-meta table {
      margin-left: auto;
      font-size: 9pt;
      border-collapse: collapse
    }

    .doc-meta td {
      padding: 1px 0 1px 12px
    }

    .doc-meta td:first-child {
      color: #5b6e74
    }

    .doc-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #1b2a2f;
      margin-top: 12px
    }

    .doc-parties>div {
      padding: 8px 10px
    }

    .doc-parties>div+div {
      border-left: 1px solid #1b2a2f
    }

    .doc-parties small {
      color: #5b6e74;
      display: block;
      margin-bottom: 2px
    }

    .doc-intro {
      margin-top: 10px;
      white-space: pre-line
    }

    .doc-tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 9pt
    }

    .doc-tbl th {
      background: var(--doc-header-bg, #1b2a2f);
      color: #fff;
      text-align: left;
      padding: 6px 8px;
      font-weight: 600;
    }

    .doc-tbl td {
      border-bottom: 1px solid #cfd8d6;
      padding: 6px;
      vertical-align: top
    }

    .doc-tbl tr {
      break-inside: avoid
    }

    .doc-tbl .r {
      text-align: right;
      white-space: nowrap
    }

    .doc-tbl tr.sec td {
      background: #e2f0f0;
      font-weight: 600
    }

    .doc-item {
      display: flex;
      gap: 8px
    }

    .doc-item .glyph {
      flex: none
    }

    .doc-spec {
      color: #4a5d63;
      font-size: 8.5pt
    }

    .doc-boq-row {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .doc-boq-img {
      width: 72px;
      height: 54px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #cfd8d6;
      flex: none
    }

    /* BOQ editor image upload */
    .boq-img-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .boq-img-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .boq-thumb {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--line)
    }

    .boq-img-btn {
      cursor: pointer
    }

    .f-lbl {
      font-size: 0.8rem;
      color: var(--ink2);
      font-weight: 500
    }

    .doc-sum {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 10px;
      align-items: flex-start;
      break-inside: avoid
    }

    .doc-words {
      flex: 1;
      font-size: 9pt;
      padding-top: 4px
    }

    .doc-tot {
      width: 270px;
      border-collapse: collapse;
      font-size: 9.5pt
    }

    .doc-tot td {
      padding: 3px 0
    }

    .doc-tot td.r {
      text-align: right
    }

    .doc-tot .gt td {
      border-top: 2px solid var(--doc-header-bg, #1b2a2f);
      font-weight: 700;
      font-size: 11.5pt;
      padding-top: 5px
    }

    .doc h4 {
      font-size: 10.5pt;
      margin: 14px 0 4px;
      border-bottom: 1px solid var(--doc-accent, #2a7880);
      color: var(--doc-header-bg, #1b2a2f);
      padding-bottom: 2px
    }

    .doc ol {
      margin: 4px 0;
      padding-left: 18px
    }

    .doc-pay {
      border-collapse: collapse;
      font-size: 9pt;
      min-width: 300px
    }

    .doc-pay td,
    .doc-pay th {
      border-bottom: 1px solid #cfd8d6;
      padding: 3px 10px 3px 0;
      text-align: left
    }

    .doc-pay .r {
      text-align: right
    }

    .doc-sign {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      margin-top: 26px;
      break-inside: avoid;
      page-break-inside: avoid;
      gap: 16px;
    }

    .doc-sign>div {
      flex: 1;
      font-size: 8.5pt;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .doc-sign .ln2 {
      border-top: 1px solid #1b2a2f;
      margin-top: 36px;
      padding-top: 4px;
      color: #4a5d63;
      font-size: 8pt;
    }

    .doc-header-clean {
      border-bottom: 2px solid var(--doc-header-bg, #1b2a2f);
      padding: 8px 0 6px;
      margin-bottom: 6px;
    }

    .doc-hdr-title {
      font-size: 15pt;
      font-weight: 700;
      color: var(--doc-header-bg, #1b2a2f);
      letter-spacing: 0.5px;
    }

    .doc-hdr-sub {
      font-size: 8.5pt;
      color: #4a5d63;
      margin-top: 2px;
    }

    /* Modern Corporate Quotation Header */
    .doc-hdr-modern {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2.5px solid var(--doc-header-bg, #1b2a2f);
      padding: 8px 0 10px;
      margin-bottom: 12px;
      gap: 16px;
    }
    .doc-hdr-left {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex: 1;
    }
    .doc-logo-img {
      max-height: 80px;
      max-width: 140px;
      object-fit: contain;
      align-self: center;
    }
    .doc-hdr-company {
      font-size: 15pt;
      font-weight: 800;
      color: var(--doc-header-bg, #1b2a2f);
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    .doc-hdr-tagline {
      font-size: 8.5pt;
      font-style: italic;
      color: var(--doc-accent, #2a7880);
      margin-top: 2px;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .doc-hdr-address {
      font-size: 8pt;
      color: #334155;
      line-height: 1.35;
      margin-top: 2px;
    }
    .doc-hdr-contacts {
      font-size: 7.5pt;
      color: #475569;
      margin-top: 3px;
      line-height: 1.3;
    }
    .doc-hdr-regs {
      font-size: 7.5pt;
      color: #0f172a;
      margin-top: 3px;
    }
    .doc-hdr-iso {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 110px;
      max-width: 150px;
      padding-left: 12px;
      border-left: 1px dashed #cbd5e1;
      align-self: center;
    }
    .doc-iso-badge {
      max-height: 52px;
      max-width: 90px;
      object-fit: contain;
      margin-bottom: 3px;
    }
    .doc-iso-txt {
      font-size: 7pt;
      color: #1e293b;
      line-height: 1.2;
      text-align: center;
    }

    .doc-ftr-modern {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #cbd5e1;
      padding-top: 6px;
      font-size: 7.5pt;
      color: #64748b;
      margin-top: 8px;
    }

    .doc-ftr-clean {
      border-top: 1px solid #cfd8d6;
      padding-top: 4px;
      font-size: 7.5pt;
      color: #6c7f85;
      text-align: center;
    }

    .doc-ft {
      margin-top: 14px;
      font-size: 8pt;
      color: #6c7f85;
      border-top: 1px solid #cfd8d6;
      padding-top: 4px
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm
      }

      body>*:not(#preview) {
        display: none !important
      }

      body {
        background: #fff
      }

      #preview {
        position: static;
        background: none;
        overflow: visible;
        display: block !important
      }

      .pv-bar {
        display: none
      }

      .sheet {
        width: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        box-shadow: none
      }

      .doc-tbl th,
      .doc-tbl tr.sec td,
      .doc-parties {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
    }

    /* letterhead document (overrides) */
    fieldset.fs {
      border: 0;
      padding: 0;
      margin: 0;
      min-width: 0
    }

    .sheet {
      position: relative;
      padding: 0;
      overflow: hidden
    }

    .pg {
      width: 100%;
      min-height: 297mm;
      border-collapse: collapse
    }

    .pg>thead>tr>td {
      padding: 5mm 7mm 0
    }

    .pg>tbody>tr>td {
      padding: 2mm 13mm 4mm;
      vertical-align: top;
      height: 100%
    }

    .pg>tfoot>tr>td {
      padding: 0 7mm 4mm;
      vertical-align: bottom
    }

    .hd-img,
    .ft-img {
      display: block;
      width: 100%
    }

    .wm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118mm;
      transform: translate(-50%, -50%);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0
    }

    .pg td>* {
      position: relative;
      z-index: 1
    }

    .doc-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-top: 2mm
    }

    .doc-title h1 {
      font-size: 19pt;
      letter-spacing: .14em
    }

    .stamp {
      display: inline-block;
      border: 2px solid #b03a3a;
      color: #b03a3a;
      padding: 1px 8px;
      font-weight: 600;
      font-size: 9pt;
      letter-spacing: .05em;
      transform: rotate(-3deg)
    }

    .doc-info {
      border-collapse: collapse;
      font-size: 9pt
    }

    .doc-info td {
      padding: 1px 0 1px 14px;
      text-align: right
    }

    .doc-info td:first-child {
      color: #5b6e74
    }

    .doc-sub {
      margin-top: 8px;
      font-weight: 600
    }

    .doc-parties {
      margin-top: 8px
    }

    .doc-bank {
      font-size: 9pt;
      margin-top: 4px
    }

    .doc-tbl td.c {
      text-align: center
    }

    .doc-tbl .big {
      font-weight: 600
    }

    .doc-note {
      font-size: 8.5pt;
      color: #4a5d63;
      margin-top: 3px
    }

    .no-sel {
      user-select: none
    }

    .bar {
      height: 10px;
      border-radius: 3px;
      background: var(--glass);
      min-width: 2px
    }

    .bars {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) auto;
      gap: 8px 10px;
      align-items: center;
      font-size: .9rem
    }

    .lnk {
      background: none;
      border: 0;
      color: var(--glass-d);
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-decoration: underline
    }

    .pk {
      display: grid;
      gap: 6px;
      max-height: 50vh;
      overflow: auto;
      margin-top: 10px
    }

    .pk button {
      text-align: left;
      font: inherit;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: .5rem .7rem;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .pk button:hover {
      border-color: var(--glass);
      background: var(--glass-l)
    }

    .pk small {
      color: var(--mute);
      display: block
    }

    @media print {
      @page {
        size: A4;
        margin: 0
      }

      .sheet {
        overflow: visible
      }

      .pg {
        min-height: 0
      }

      .wm {
        position: fixed
      }

      /* Clean table header and footer for paged print */
      .pg>thead {
        display: table-header-group;
      }

      .pg>tfoot {
        display: table-footer-group;
      }

      .pg>tfoot>tr>td {
        position: static;
        padding: 2mm 7mm 4mm;
        vertical-align: bottom;
      }

      .pg>tbody>tr>td {
        padding-bottom: 6mm;
      }
    }
  </style>
</head>

    window.__CLOUD_MODE__ = true;

    const FM = {
      isAvailable() {
        return typeof window.Motion !== 'undefined' && typeof window.Motion.animate === 'function';

      animate(el, keyframes, options) {
        if (!el || !this.isAvailable()) return null;
        try {
          return window.Motion.animate(el, keyframes, options);
        } catch(e) { return null; }
      },
      spring(opts = {}) {
        if (this.isAvailable() && window.Motion.spring) {
          return window.Motion.spring({ stiffness: 320, damping: 28, mass: 1, ...opts });

      pageEnter(container) {

          window.Motion.animate(container, { opacity: [0, 1], y: [12, 0] }, { duration: 0.28, easing: 'ease-out' });

              duration: 0.3,
              easing: 'ease-out'

    /* Live Animated Canvas for Dynamic Blueprint / Architecture Waves */
    function initAuthCanvas() {
      const canvas = document.getElementById('auth_canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      const onResize = () => {
        if (!canvas) return;
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      };
      window.removeEventListener('resize', onResize);
      window.addEventListener('resize', onResize);
      const dots = [];
      for (let i = 0; i < 35; i++) {
        dots.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 2 + 1
        });
      }
      function render() {
        if (!document.getElementById('auth_canvas')) return;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < 0 || d.x > width) d.vx *= -1;
          if (d.y < 0 || d.y > height) d.vy *= -1;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          ctx.fill();
          for (let j = i + 1; j < dots.length; j++) {
            const d2 = dots[j];
            const dist = Math.hypot(d.x - d2.x, d.y - d2.y);
            if (dist < 120) {
              ctx.lineWidth = 1 - dist / 120;
              ctx.beginPath();
              ctx.moveTo(d.x, d.y);
              ctx.lineTo(d2.x, d2.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(render);
      }
      render();
    }

    async function generateQuotePdfBlob(q) {

      container.style.top = '0';

      container.style.background = '#ffffff';

      renderDocQr(container, q);

      const opt = {
        margin: [6, 6, 6, 6],
        filename: `Quotation_${(q.no || 'quote').replace(/[/\\?%*:|"<>]/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        if (typeof html2pdf === 'undefined') {
          throw new Error('PDF generator library loading, please try again in a moment.');
        }
        const pdfBlob = await html2pdf().set(opt).from(container).output('blob');
        document.body.removeChild(container);
        return pdfBlob;
      } catch (e) {
        if (container.parentNode) document.body.removeChild(container);
        throw e;
      }
    }

    async function loadAuditRecords() {
      const tbody = $('#auditRows');
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px"><div class="mute">Fetching latest logs from server...</div></td></tr>`;
      try {
        const res = await apiGet('/api/admin/login-audit');
        _auditData = (res && res.logs) || [];
        updateAuditKpis();
        renderAuditRows();
      } catch (e) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--bad)">Could not load audit logs: ${esc(e.message)}</td></tr>`;
      }
    }

    function updateAuditKpis() {
      const totalEl = $('#auditKpiTotal'), succEl = $('#auditKpiSuccess'), failEl = $('#auditKpiFailed'), ipsEl = $('#auditKpiIps');
      if (!totalEl) return;
      const total = _auditData.length;
      const succ = _auditData.filter(x => x.status === 'SUCCESS').length;
      const fail = _auditData.filter(x => x.status === 'FAILED' || x.status === 'BLOCKED').length;
      const ips = new Set(_auditData.map(x => x.ip).filter(Boolean)).size;
      totalEl.textContent = total;
      succEl.textContent = succ;
      failEl.textContent = fail;
      ipsEl.textContent = ips;
    }

    function renderAuditRows() {
      const tbody = $('#auditRows');
      if (!tbody) return;
      const q = ($('#auditSearchInput') ? $('#auditSearchInput').value.trim().toLowerCase() : '');
      const co = ($('#auditCompanySelect') ? $('#auditCompanySelect').value : '');
      const stat = ($('#auditStatusSelect') ? $('#auditStatusSelect').value : '');

      let filtered = _auditData.filter(log => {
        if (stat && log.status !== stat) return false;
        if (co && (log.companyName || '') !== co && (log.companyId || '') !== co) return false;
        if (!q) return true;
        return (
          (log.companyName || '').toLowerCase().includes(q) ||
          (log.username || '').toLowerCase().includes(q) ||
          (log.ip || '').toLowerCase().includes(q) ||
          (log.reason || '').toLowerCase().includes(q)
        );
      });

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px"><div class="empty">No login events match your search criteria.</div></td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(log => {
        let badge = `<span class="bd approved">SUCCESS</span>`;
        if (log.status === 'FAILED') badge = `<span class="bd rejected">FAILED</span>`;
        else if (log.status === 'BLOCKED') badge = `<span class="bd rejected" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5">BLOCKED</span>`;

        let device = log.userAgent || '-';
        if (device.includes('Windows')) device = '💻 Windows PC';
        else if (device.includes('Macintosh') || device.includes('Mac OS')) device = '🍎 Mac';
        else if (device.includes('iPhone')) device = '📱 iPhone';
        else if (device.includes('Android')) device = '📱 Android';
        else if (device.includes('Linux')) device = '🐧 Linux';

        return `<tr>
          <td class="nowrap"><b>${esc(log.dateStr || '-')}</b></td>
          <td><b>${esc(log.companyName || 'General')}</b></td>
          <td><b>${esc(log.username || '-')}</b> <span class="mute sm">(${esc(log.role || 'user')})</span></td>
          <td><code style="background:rgba(2,132,199,0.1);color:#0284c7;padding:3px 8px;border-radius:4px;font-weight:700;font-size:0.85rem">${esc(log.ip || '-')}</code></td>
          <td>${badge}</td>
          <td class="sm">${esc(device)}</td>
          <td class="sm mute">${esc(log.reason || '-')}</td>
        </tr>`;
      }).join('');
    }

                                  u.role === 'admin' ? '<span class="bd" style="background:#f3e8ff;color:#6b21a8;border:1px solid #e9d5ff">⚙️ Admin</span>' :
                                  u.role === 'master' ? '<span class="bd" style="background:#ffe4e6;color:#9f1239;border:1px solid #fecdd3">👑 Master</span>' :
                                  '<span class="bd" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1">💼 Sales</span>';

                const access = u.access || (u.role === 'sales' ? 'wo' : 'rw');
                const accessBadge = access === 'rw' ? '<span class="bd approved" style="font-size:0.75rem">✏️ Read &amp; Write</span>' :
                                    access === 'ro' ? '<span class="bd" style="background:#fef3c7;color:#b45309;font-size:0.75rem">👁️ Only Read</span>' :
                                    '<span class="bd" style="background:#e0e7ff;color:#4338ca;font-size:0.75rem">📝 Only Write</span>';

                const perms = [];
                if (u.role === 'master' || u.role === 'admin' || u.role === 'md') perms.push('All Access');
                else {
                  if (u.canApprove || u.role === 'manager') perms.push('Approve');
                  if (u.canPayments || u.role === 'accounts') perms.push('Payments');
                  if (u.canRates || u.role === 'manager') perms.push('Rates');
                  if (u.canMargin || u.role === 'manager') perms.push('Margins');
                  if (u.canSettings) perms.push('Settings');
                }
                const permsHtml = perms.length ? perms.map(p => `<span class="chip on" style="font-size:0.72rem;padding:2px 7px;margin:1px">${p}</span>`).join(' ') : '<span class="mute sm">Standard</span>';

                return `<tr>
                  <td><b>${esc(u.name)}</b></td>
                  <td><code>${esc(u.username)}</code></td>
                  <td>${roleBadge}</td>
                  <td>${accessBadge}</td>
                  <td>${permsHtml}</td>
                  <td>${u.active ? '<span class="bd approved">Active</span>' : '<span class="mute">Switched off</span>'}</td>
                  <td class="r nowrap">
                    <button class="btn sm" data-act="userEdit" data-id="${u.id}">Edit</button>
                    <button class="btn sm" data-act="userPw" data-id="${u.id}">Password</button>
                    ${u.id !== me.id ? `<button class="btn sm bad" data-act="userDel" data-id="${u.id}">Delete</button>` : ''}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }
    ACT.userPw = b => pwModal(db.users.find(x => x.id === b.dataset.id), false);
    ACT.userDel = b => {
      const u = db.users.find(x => x.id === b.dataset.id);
      if (!u) return;
      if (u.id === me.id) { toast('You cannot delete your own account.', 'bad'); return; }
      confirmBox(`Delete user ${esc(u.name)} (${esc(u.username)})?`, () => {
        db.users = db.users.filter(x => x.id !== u.id);
        persist(true);
        viewUsers();
        toast('User deleted.');
      }, 'Delete', 'bad');
    };
    ACT.userEdit = b => {
      const u = b.dataset.id ? db.users.find(x => x.id === b.dataset.id) : {
        name: '',
        username: '',
        role: 'sales',
        access: 'rw',
        canApprove: false,
        canPayments: false,
        canRates: false,
        canMargin: false,
        canSettings: false,
        active: true
      }, isNew = !b.dataset.id;

      const curRole = u.role || 'sales';
      const curAccess = u.access || 'rw';

      modal({
        title: isNew ? '👤 Add User &amp; Assign Permissions' : '👤 Edit User &amp; Permissions',
        wide: true,
        body: `<div class="grid g2">
          <label class="f" style="grid-column:1/-1"><span>Full Name *</span><input name="name" value="${esc(u.name)}" placeholder="e.g. Rajesh Kumar" required></label>
          <label class="f"><span>Username *</span><input name="username" value="${esc(u.username)}" autocapitalize="none" placeholder="e.g. rajesh" required></label>
          ${isNew ? '<label class="f"><span>Password (min 6 characters) *</span><input name="pw" type="password" placeholder="••••••" required></label>' : '<label class="f"><span>Password</span><input type="text" value="(Unchanged - use Reset Password to modify)" disabled></label>'}
          
          <label class="f"><span>Job Role *</span>
            <select name="role" id="userRoleSelect">
              <option value="md" ${curRole === 'md' ? 'selected' : ''}>🎖️ Managing Director (MD)</option>
              <option value="manager" ${curRole === 'manager' ? 'selected' : ''}>👔 Manager</option>
              <option value="accounts" ${curRole === 'accounts' ? 'selected' : ''}>💳 Accounts &amp; Finance</option>
              <option value="sales" ${curRole === 'sales' ? 'selected' : ''}>💼 Sales Executive</option>
              <option value="admin" ${curRole === 'admin' ? 'selected' : ''}>⚙️ Company Admin</option>
            </select>
          </label>

          <label class="f"><span>Permission Access Level *</span>
            <select name="access" id="userAccessSelect">
              <option value="rw" ${curAccess === 'rw' ? 'selected' : ''}>✏️ Read &amp; Write (Full create &amp; edit)</option>
              <option value="ro" ${curAccess === 'ro' ? 'selected' : ''}>👁️ Only Read (View-only mode)</option>
              <option value="wo" ${curAccess === 'wo' ? 'selected' : ''}>📝 Only Write (Draft creation only)</option>
            </select>
          </label>

          <div style="grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:6px">
            <div style="font-weight:600;font-size:0.95rem;margin-bottom:8px">🔐 Granular Permission Capabilities</div>
            <div class="grid g2">
              <label class="chk"><input type="checkbox" name="canApprove" id="p_canApprove" ${u.canApprove || ['md', 'manager', 'admin'].includes(curRole) ? 'checked' : ''}> <b>Can Finalise &amp; Approve Quotes</b><div class="mute sm" style="margin-left:22px">Authorise quotes exceeding discount limits</div></label>
              <label class="chk"><input type="checkbox" name="canPayments" id="p_canPayments" ${u.canPayments || ['md', 'manager', 'accounts', 'admin'].includes(curRole) ? 'checked' : ''}> <b>Can Record &amp; Manage Payments</b><div class="mute sm" style="margin-left:22px">Enter receipts, milestones &amp; track balances</div></label>
              <label class="chk"><input type="checkbox" name="canRates" id="p_canRates" ${u.canRates || ['md', 'manager', 'admin'].includes(curRole) ? 'checked' : ''}> <b>Can Edit Rate Library &amp; Profiles</b><div class="mute sm" style="margin-left:22px">Change square foot rates, profiles &amp; hardware</div></label>
              <label class="chk"><input type="checkbox" name="canMargin" id="p_canMargin" ${u.canMargin || ['md', 'manager', 'admin'].includes(curRole) ? 'checked' : ''}> <b>Can View Internal Profit Margins</b><div class="mute sm" style="margin-left:22px">Inspect cost vs revenue &amp; profit margins</div></label>
              <label class="chk" style="grid-column:1/-1"><input type="checkbox" name="canSettings" id="p_canSettings" ${u.canSettings || ['md', 'admin'].includes(curRole) ? 'checked' : ''}> <b>Can Edit Company Settings &amp; Bank Details</b><div class="mute sm" style="margin-left:22px">Manage company GST, address, bank accounts &amp; templates</div></label>
            </div>
          </div>

          <label class="chk" style="grid-column:1/-1;margin-top:4px"><input type="checkbox" name="active" ${u.active ? 'checked' : ''}> Account is active (enabled for login)</label>
        </div>`,
        onOk: async el => {
          const d = formData(el); d.username = d.username.trim().toLowerCase();
          if (!d.name.trim() || !d.username) { toast('Enter a name and username.', 'bad'); return false; }
          if (db.users.some(x => x.username === d.username && x !== u)) { toast('That username is taken.', 'bad'); return false; }
          if (isNew && (d.pw || '').length < 6) { toast('Password must be at least 6 characters.', 'bad'); return false; }
          const admins = db.users.filter(x => (x.role === 'admin' || x.role === 'md') && x.active && x !== u).length;
          if (!isNew && (d.role !== 'admin' && d.role !== 'md' || !d.active) && (u.role === 'admin' || u.role === 'md') && !admins) { toast('Keep at least one active admin or MD.', 'bad'); return false; }
          if (u === me && !d.active) { toast('You cannot switch off your own account.', 'bad'); return false; }

          const payload = {
            name: d.name.trim(),
            username: d.username,
            role: d.role,
            access: d.access || 'rw',
            canApprove: !!d.canApprove,
            canPayments: !!d.canPayments,
            canRates: !!d.canRates,
            canMargin: !!d.canMargin,
            canSettings: !!d.canSettings,
            active: !!d.active
          };

          if (isNew) {
            const salt = uid();
            db.users.push({
              id: uid(),
              ...payload,
              salt,
              pass: await hashPw(d.pw, salt)
            });
          } else {
            Object.assign(u, payload);
          }
          persist(true);
          renderApp();
          toast(isNew ? 'User created with permissions! 🎉' : 'User updated! ✅');
        }
      });

      // Role selection auto-preset trigger
      setTimeout(() => {
        const sel = document.getElementById('userRoleSelect');
        if (sel) {
          sel.onchange = () => {
            const r = sel.value;
            const ca = document.getElementById('p_canApprove');
            const cp = document.getElementById('p_canPayments');
            const cr = document.getElementById('p_canRates');
            const cm = document.getElementById('p_canMargin');
            const cs = document.getElementById('p_canSettings');
            const acc = document.getElementById('userAccessSelect');
            if (r === 'md') {
              if (ca) ca.checked = true; if (cp) cp.checked = true; if (cr) cr.checked = true; if (cm) cm.checked = true; if (cs) cs.checked = true;
              if (acc) acc.value = 'rw';
            } else if (r === 'manager') {
              if (ca) ca.checked = true; if (cp) cp.checked = true; if (cr) cr.checked = true; if (cm) cm.checked = true; if (cs) cs.checked = false;
              if (acc) acc.value = 'rw';
            } else if (r === 'accounts') {
              if (ca) ca.checked = false; if (cp) cp.checked = true; if (cr) cr.checked = false; if (cm) cm.checked = false; if (cs) cs.checked = true;
              if (acc) acc.value = 'rw';
            } else if (r === 'sales') {
              if (ca) ca.checked = false; if (cp) cp.checked = false; if (cr) cr.checked = false; if (cm) cm.checked = false; if (cs) cs.checked = false;
              if (acc) acc.value = 'rw';
            } else if (r === 'admin') {
              if (ca) ca.checked = true; if (cp) cp.checked = true; if (cr) cr.checked = true; if (cm) cm.checked = true; if (cs) cs.checked = true;
              if (acc) acc.value = 'rw';
            }
          };
        }
      }, 50);
    };

    function windowSvg({ type = 'slider', w = 1200, h = 1200 } = {}) {
      const maxW = 180, maxH = 140;

      const W = w * s, H = h * s, f = 5;
      const glassColor = '#cfe8f1', glassColor2 = '#e3f2f8';

      if (type === 'slider' || type === 'sliding') {
        const pw = (W - 2 * f) / 2 + 3;
        inner = `<rect x="${f}" y="${f}" width="${pw}" height="${H - 2*f}" fill="${glassColor}" stroke="#5a7f8c" stroke-width="1"/><rect x="${W-f-pw}" y="${f}" width="${pw}" height="${H - 2*f}" fill="${glassColor2}" stroke="#5a7f8c" stroke-width="1"/><path d="M${W*.3} ${H/2} h${W*.13} m-5 -4 l5 4 l-5 4" stroke="#2a6080" fill="none" stroke-width="1.2"/>`;
      } else if (type === 'casement') {
        inner = `<rect x="${f}" y="${f}" width="${W-2*f}" height="${H-2*f}" fill="${glassColor}" stroke="#5a7f8c" stroke-width="1"/><path d="M${f} ${f} L${W-f} ${H/2} L${f} ${H-f}" stroke="#2a6080" fill="none" stroke-dasharray="4 3" stroke-width="1"/>`;
      } else if (type === 'door') {
        inner = `<rect x="${f}" y="${f}" width="${W-2*f}" height="${H-2*f}" fill="#d4bfa0" stroke="#8b6347" stroke-width="1"/><rect x="${f+4}" y="${f+4}" width="${(W-2*f-8)*0.9}" height="${(H-2*f-8)*0.4}" fill="none" stroke="#8b6347" stroke-width="0.8"/><rect x="${f+4}" y="${f+4+(H-2*f-8)*0.45}" width="${(W-2*f-8)*0.9}" height="${(H-2*f-8)*0.5}" fill="none" stroke="#8b6347" stroke-width="0.8"/><circle cx="${W-f-8}" cy="${H/2}" r="2" fill="#8b6347"/>`;
      } else {
        inner = `<rect x="${f}" y="${f}" width="${W-2*f}" height="${H-2*f}" fill="${glassColor}" stroke="#5a7f8c" stroke-width="1"/><line x1="${f+8}" y1="${H-f-8}" x2="${W-f-8}" y2="${f+8}" stroke="#8ab8cc" stroke-width="1"/>`;
      }
      const label = w > 0 && h > 0 ? `<text x="${W/2}" y="-6" text-anchor="middle" font-size="10" fill="#2a6080" font-family="sans-serif">${w} × ${h} mm</text>` : '';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -18 ${W+8} ${H+22}" width="${W+8}" height="${H+22}" style="display:block">
        <rect width="${W}" height="${H}" fill="#9aa5ad" stroke="#445" stroke-width="1.5" rx="1"/>${inner}${label}

          qty: 1
