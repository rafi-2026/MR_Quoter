        const prodItems = (db.products || []).map(p => ({
          source: 'library_prod',
          type: 'size',
          _libId: p.id,
          name: p.name,
          spec: p.desc || '',
          glyph: p.glyph || 'slider',
          rate: p.rate,
          minArea: p.minArea || 0,
          cost: p.cost || 0,
          category: p.category || 'Windows/Doors',
          unit: 'sq ft',
          disc: 0,
          qty: 1
        }));

        const profItems = (db.profiles || []).map(p => ({
          source: 'library_prof',
          type: 'boq',
          _libId: p.id,
          name: p.name,
          desc: `${p.material || ''} ${p.series || ''} • ${p.weightPerM || 0} kg/m • ₹${p.ratePerKg || 0}/kg`,
          unit: 'kg',
          rate: p.ratePerKg || 0,
          category: 'Profiles',
          disc: 0,
          qty: 1
        }));

        const allItems = [...boqItems, ...prodItems, ...profItems, ...quoteItems];
        let curFilter = 'all';

        const el = modal({
          title: 'Search Rate Library & Line Item History',
          wide: true,
          noFooter: true,
          body: `
          <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
            <button class="chip on" id="hTabAll" type="button">All Items (${allItems.length})</button>
            <button class="chip" id="hTabLib" type="button">Rate Library (${boqItems.length + prodItems.length + profItems.length})</button>
            <button class="chip" id="hTabQuotes" type="button">Past Quotes History (${quoteItems.length})</button>
          </div>
          <div class="tools" style="margin-bottom:10px">
            <input type="search" id="hItemSearch" placeholder="Search by name, category, gypsum, profile, customer, quote #..." style="width:100%" autofocus>
          </div>
          <div style="max-height:60vh;overflow:auto">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Item Name & Description</th>
                  <th>Source / Category</th>
                  <th>Ref / Customer</th>
                  <th class="r">Size / Unit</th>
                  <th class="r">Rate</th>
                  <th class="r">Action</th>
                </tr>
              </thead>
              <tbody id="hItemRows"></tbody>
            </table>
          </div>`
        });

        const drawH = () => {
          const t = ($('#hItemSearch', el).value || '').trim().toLowerCase();
          let list = allItems;
          if (curFilter === 'lib') list = [...boqItems, ...prodItems, ...profItems];
          else if (curFilter === 'quotes') list = quoteItems;

          const matches = list.filter(m => {
            if (!t) return true;
            return (m.name || '').toLowerCase().includes(t) ||
              (m.desc || '').toLowerCase().includes(t) ||
              (m.spec || '').toLowerCase().includes(t) ||
              (m.category || '').toLowerCase().includes(t) ||
              (m.cName || '').toLowerCase().includes(t) ||
              (m.qNo || '').toLowerCase().includes(t);
          }).slice(0, 60);

          $('#hItemRows', el).innerHTML = matches.length ? matches.map((m, idx) => {
            const isLib = m.source.startsWith('library');
            const sourceBadge = isLib 
              ? `<span class="bd approved" style="font-size:0.75rem">${esc(m.category || 'Rate Library')}</span>`
              : `<span class="bd sent" style="font-size:0.75rem">Past Quote</span>`;
            const refCol = isLib 
              ? `<div class="mute sm">Standard Library</div>` 
              : `<b>${esc(m.qNo || '')}</b><div class="mute sm">${esc(m.cName || '')} ${m.date ? '• ' + fmtDate(m.date) : ''}</div>`;
            const sizeCol = m.w ? `${m.w} &times; ${m.h}` : esc(m.unit || 'nos');
            return `<tr>
              <td>
                <b>${esc(m.name || m.desc || '')}</b>
                ${m.desc && m.name && m.desc !== m.name ? `<div class="mute sm">${esc(m.desc)}</div>` : ''}
                ${m.spec ? `<div class="mute sm">${esc(m.spec)}</div>` : ''}
              </td>
              <td>${sourceBadge}</td>
              <td>${refCol}</td>
              <td class="r">${sizeCol}</td>
              <td class="r"><b>${rs(m.rate)}</b></td>
              <td class="r">
                <button class="btn sm pri" data-himport="${idx}">+ Add to Quote</button>
              </td>
            </tr>`;
          }).join('') : `<tr><td colspan="6"><div class="empty">No items match "${esc(t)}". Try another search term.</div></td></tr>`;

          $$('[data-himport]', el).forEach(btn => {
            btn.onclick = e => {
              const target = matches[+e.currentTarget.dataset.himport];
              if (!target) return;
              let newItem;
              if (target.source === 'library_prod') {
                newItem = mkSize(target._prodObj || target);
                newItem.rate = target.rate;
                newItem.name = target.name;
                newItem.spec = target.spec || '';
              } else if (target.source === 'library_boq' || target.source === 'library_prof') {
                newItem = mkBoq(target._itemObj || target);
                newItem.name = target.name;
                newItem.desc = target.desc || '';
                newItem.rate = target.rate;
                newItem.unit = target.unit || 'nos';
              } else {
                newItem = JSON.parse(JSON.stringify(target));
                newItem.id = uid();
                delete newItem.source;
                delete newItem.qNo;
                delete newItem.date;
                delete newItem.cName;
              }
              Q.lines.push(newItem);
              touch();
              drawLines();
              refreshCalc();
              closeModal();
              toast(`Added "${newItem.name || 'item'}" to quote.`);
            };
          });
        };

        $('#hTabAll', el).onclick = () => { curFilter = 'all'; $$('.chip', el).forEach(c => c.classList.remove('on')); $('#hTabAll', el).classList.add('on'); drawH(); };
        $('#hTabLib', el).onclick = () => { curFilter = 'lib'; $$('.chip', el).forEach(c => c.classList.remove('on')); $('#hTabLib', el).classList.add('on'); drawH(); };
        $('#hTabQuotes', el).onclick = () => { curFilter = 'quotes'; $$('.chip', el).forEach(c => c.classList.remove('on')); $('#hTabQuotes', el).classList.add('on'); drawH(); };
        $('#hItemSearch', el).oninput = drawH;
        drawH();
      }
    });
    function setStatus(s, note) { Q.status = s; Q.updatedAt = Date.now(); logq(Q, note); persist(true); viewQuote(Q.id) }

    /* ========== printable document ========== */
    function docHTML(q) {
      const s = db.settings, t = calcTotals(q), c = q.cust, unit = q.dimUnit || 'mm'; let n = 0;
      const exp = addDays(q.date, num(q.validity) || 0);
      const rows = q.lines.map(l => {
        if (l.type === 'section') return `<tr class="sec"><td colspan="6">${esc(l.title)}</td></tr>`;
        n++; const k = lineCalc(l, q);
        if (l.type === 'size') return `<tr><td class="c">${n}</td><td><div class="doc-item">${glyph(l.glyph, 34)}<div><span class="big">${esc(l.name)}</span>${l.tag || l.loc ? `<div class="doc-spec">${[l.tag && 'Mark ' + esc(l.tag), esc(l.loc)].filter(Boolean).join(' - ')}</div>` : ''}${l.spec ? `<div class="doc-spec">${nl2(l.spec)}</div>` : ''}<div class="doc-spec">${esc(l.glassName)}; ${esc(l.finishName)}</div><div class="doc-spec">Area ${inr(k.billed)} sq ft each, ${inr(k.totalArea)} sq ft in total${num(l.hw) ? `; hardware ${rs(num(l.hw))} each` : ''}${num(l.disc) ? `; less ${num(l.disc)}%` : ''}</div></div></div></td><td class="r">${num(l.w)} &times; ${num(l.h)} ${unit}</td><td class="r">${num(l.qty)} nos</td><td class="r">${rs(k.rate)}<div class="doc-spec">per sq ft</div></td><td class="r"><b>${rs(k.amt)}</b></td></tr>`;
        return `<tr><td class="c">${n}</td><td><div class="doc-boq-row">${l.img ? `<img class="doc-boq-img" src="${l.img}" alt="">` : ''}<div><span class="big">${esc(l.name) || nl2(l.desc)}</span>${l.name && l.desc ? `<div class="doc-spec">${nl2(l.desc)}</div>` : ''}${num(l.disc) ? `<div class="doc-spec">Less ${num(l.disc)}%</div>` : ''}</div></div></td><td class="r"></td><td class="r">${num(l.qty)} ${esc(l.unit)}</td><td class="r">${rs(num(l.rate))}<div class="doc-spec">per ${esc(l.unit)}</div></td><td class="r"><b>${rs(k.amt)}</b></td></tr>`;
      }).join('');
      const pays = (q.pay || []).filter(p => p.label || p.pct);
      const b = s.bank, hasBank = b.acNo || b.acName || b.ifsc;
      const terms = q.terms.split('\n').map(x => x.trim()).filter(Boolean);
      const draft = !['approved', 'sent', 'won', 'lost'].includes(q.status);
      const hdrImg = getHeaderImg();
      const ftrImg = getFooterImg();
      const wmImg = db.settings.watermarkImg || '';
      return `${wmImg ? `<img class="wm" src="${wmImg}" alt="">` : ''}
  <table class="pg doc"><thead><tr><td>${(s.headerStyle === 'letterhead' && hdrImg) ? `<img class="hd-img" src="${hdrImg}" alt="${esc(s.company)}">` : (s.company ? `
  <div class="doc-hdr-modern">
    <div class="doc-hdr-left">
      ${s.logoImg ? `<img class="doc-logo-img" src="${s.logoImg}" alt="Company Logo">` : ''}
      <div style="flex:1">
        <div class="doc-hdr-company">${esc(s.company)}</div>
        ${s.tagline ? `<div class="doc-hdr-tagline">${esc(s.tagline)}</div>` : ''}
        ${(s.address1 || s.city || s.state) ? `<div class="doc-hdr-address">${[s.address1, s.address2, s.city, s.state && (s.state + (s.pincode ? ' - ' + s.pincode : ''))].filter(Boolean).map(esc).join(', ')}</div>` : ''}
        ${(s.phone || s.mobile || s.email || s.website) ? `<div class="doc-hdr-contacts">${[s.phone && 'Tel: ' + esc(s.phone), s.mobile && 'Mob: ' + esc(s.mobile), s.email && 'Email: ' + esc(s.email), s.website && 'Web: ' + esc(s.website)].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div>` : ''}
        ${(s.gstin || s.pan || s.msme || s.cin) ? `<div class="doc-hdr-regs">${[s.gstin && '<b>GSTIN:</b> ' + esc(s.gstin), s.pan && '<b>PAN:</b> ' + esc(s.pan), s.msme && '<b>MSME:</b> ' + esc(s.msme), s.cin && '<b>CIN:</b> ' + esc(s.cin)].filter(Boolean).join(' &nbsp;&bull;&nbsp; ')}</div>` : ''}
      </div>
    </div>
    ${(s.isoStandard || s.isoImg) ? `
    <div class="doc-hdr-iso">
      ${s.isoImg ? `<img src="${s.isoImg}" class="doc-iso-badge" alt="ISO Certification">` : ''}
      ${s.isoStandard ? `<div class="doc-iso-txt"><b>${esc(s.isoStandard)}</b>${s.isoCertNo ? `<br><small>Cert No: ${esc(s.isoCertNo)}</small>` : ''}</div>` : ''}
    </div>` : ''}
  </div>` : '')}</td></tr></thead>
  <tbody><tr><td>
   <div class="doc-title"><div><h1>QUOTATION</h1>${draft ? `<span class="stamp">DRAFT, NOT APPROVED</span>` : ''}</div>
    <table class="doc-info"><tr><td>Quotation no.</td><td><b>${esc(q.no)}</b></td></tr><tr><td>Date</td><td>${fmtDate(q.date)}</td></tr><tr><td>Valid until</td><td>${fmtDate(exp)}</td></tr>${q.rev ? `<tr><td>Revision</td><td>${q.rev}</td></tr>` : ''}</table></div>
   <div class="doc-parties"><div><small>Quotation for</small><b>${esc(c.name)}</b>${c.contact ? `<br>Attn: ${esc(c.contact)}` : ''}${c.address ? `<br>${nl2(c.address)}` : ''}${c.phone || c.email ? `<br>${[esc(c.phone), esc(c.email)].filter(Boolean).join(' | ')}` : ''}${c.gstin ? `<br>GSTIN: ${esc(c.gstin)}` : ''}</div>
    <div><small>Project</small><b>${esc(q.project || '-')}</b>${q.site ? `<br>Site: ${esc(q.site)}` : ''}<br>Place of supply: ${esc(q.pos || s.state)}</div></div>
   ${q.subject ? `<div class="doc-sub">Sub: ${esc(q.subject)}</div>` : ''}
   ${q.intro ? `<div class="doc-intro">${esc(q.intro)}</div>` : ''}
   <table class="doc-tbl"><thead><tr><th style="width:26px">#</th><th>Description</th><th class="r">Size</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${rows || '<tr><td colspan="6">No items</td></tr>'}</tbody></table>
   <div class="doc-sum"><div class="doc-words"><b>Amount in words</b><br>${esc(rupeesWords(t.grand))}</div>
    <table class="doc-tot"><tr><td>Items subtotal</td><td class="r">${rs(t.sub)}</td></tr>${t.dAmt ? `<tr><td>Discount${q.discType === 'pct' ? ' (' + num(q.discVal) + '%)' : ''}</td><td class="r">&minus;${rs(t.dAmt)}</td></tr>` : ''}
    ${(q.extras || []).filter(e => num(e.amount)).map(e => `<tr><td>${esc(e.label || 'Extra charge')}</td><td class="r">${rs(num(e.amount))}</td></tr>`).join('')}
    ${t.dAmt || t.extras ? `<tr><td>Taxable value</td><td class="r">${rs(t.taxable)}</td></tr>` : ''}
    ${q.gst ? (t.inter ? `<tr><td>IGST @ ${t.rate}%</td><td class="r">${rs(t.ig)}</td></tr>` : `<tr><td>CGST @ ${t.rate / 2}%</td><td class="r">${rs(t.cg)}</td></tr><tr><td>SGST @ ${t.rate / 2}%</td><td class="r">${rs(t.sg)}</td></tr>`) : '<tr><td>GST</td><td class="r">Not charged</td></tr>'}
    ${t.round ? `<tr><td>Round off</td><td class="r">${t.round > 0 ? '+' : '&minus;'}${rs(Math.abs(t.round))}</td></tr>` : ''}
    <tr class="gt"><td>Grand total</td><td class="r">${rs(t.grand)}</td></tr></table></div>
   ${pays.length ? `<h4>Payment schedule</h4><table class="doc-pay"><tbody>${pays.map(p => `<tr><td>${esc(p.label)}</td><td class="r">${num(p.pct)}%</td><td class="r">${rs(t.grand * num(p.pct) / 100, 0)}</td></tr>`).join('')}</tbody></table>` : ''}
   ${hasBank ? `<h4>Bank details</h4><div class="doc-bank">${[b.acName && 'Account name: ' + esc(b.acName), b.bank && 'Bank: ' + esc(b.bank), b.acNo && 'A/C no.: ' + esc(b.acNo), b.ifsc && 'IFSC: ' + esc(b.ifsc), b.branch && 'Branch: ' + esc(b.branch)].filter(Boolean).join(' &nbsp;|&nbsp; ')}${b.upiId ? `<div style="display:flex;align-items:center;gap:12px;margin-top:8px"><div><b>UPI:</b> ${esc(b.upiId)}</div><canvas id="upiQrCanvas" width="90" height="90" style="border:1px solid #eee;border-radius:4px"></canvas></div>` : ''}</div>` : ''}
   ${terms.length ? `<h4>Terms and conditions</h4><ol>${terms.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
   ${q.notes ? `<h4>Notes</h4><div>${nl2(q.notes)}</div>` : ''}
   <div class="doc-sign">
     <div>
       Prepared By:<br><b>${esc(q.preparedByName || userName(q.createdBy))}</b>
       <div style="height:36px"></div>
       <div class="ln2">Signature &amp; Date</div>
     </div>
     <div>
       Authorised Signatory:<br><b>${esc(q.authorisedBy || s.authorisedDefault || 'Manager / MD')}</b>
       ${(s.showSealSign !== 'no' && (s.signImg || s.sealImg)) ? `
       <div style="min-height:50px;display:flex;align-items:flex-end;justify-content:flex-start;gap:12px;margin:4px 0 2px">
         ${s.sealImg ? `<img src="${s.sealImg}" alt="Company Seal" style="max-height:54px;max-width:110px;object-fit:contain">` : ''}
         ${s.signImg ? `<img src="${s.signImg}" alt="Signature" style="max-height:48px;max-width:120px;object-fit:contain">` : ''}
       </div>` : `<div style="height:36px"></div>`}
       <div class="ln2">${s.company ? 'For ' + esc(s.company.toUpperCase()) : 'Authorised Signature'}</div>
     </div>
     ${s.showClientSign !== 'no' ? `
     <div>
       Accepted By Customer:<br><b>${esc(c.name || 'Customer')}</b>
       <div style="height:36px"></div>
       <div class="ln2">Signature${s.showClientNameDate !== 'no' ? ', Name &amp; Date' : ''}</div>
     </div>` : ''}
   </div>
  </td></tr></tbody>
  <tfoot><tr><td>${(s.headerStyle === 'letterhead' && ftrImg) ? `<img class="ft-img" src="${ftrImg}" alt="">` : (s.company ? `
  <div class="doc-ftr-modern">
    <div><b>${esc(s.company)}</b> &bull; Quotation Ref: <b>${esc(q.no)}</b></div>
    <div>${[s.email, s.website, s.phone || s.mobile].filter(Boolean).map(esc).join(' &nbsp;|&nbsp; ')}</div>
    <div>${s.isoStandard ? esc(s.isoStandard) : ''}</div>
  </div>` : '')}</td></tr></tfoot></table>`;
    }
    function renderDocQr(q) {
      const cv = document.getElementById('upiQrCanvas');
      const b = (db && db.settings && db.settings.bank) || {};
      if (cv && b.upiId && typeof QRCode !== 'undefined') {
        const uri = `upi://pay?pa=${encodeURIComponent(b.upiId)}&pn=${encodeURIComponent((db.settings && db.settings.company) || 'Company')}&cu=INR&tn=${encodeURIComponent((q.no || 'Quote') + ' Payment')}`;
        QRCode.toCanvas(cv, uri, { width: 90, margin: 1 }, () => {});
      }
    }

    function previewQuote(q) {
      const p = $('#preview');
      p.innerHTML = `<div class="pv-bar"><button class="btn sm" data-act="closePreview">Close</button><button class="btn sm pri" data-act="printNow">Print or save as PDF</button><small>In the print window choose &ldquo;Save as PDF&rdquo; and turn off &ldquo;Headers and footers&rdquo;.</small></div><div class="sheet doc">${docHTML(q)}</div>`;
      p.classList.add('on'); p.scrollTop = 0; document.body.style.overflow = 'hidden';
      setTimeout(() => renderDocQr(q), 50);
    }
    ACT.closePreview = () => { $('#preview').classList.remove('on'); $('#preview').innerHTML = ''; document.body.style.overflow = '' };
    ACT.printNow = () => window.print();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#preview').classList.contains('on')) ACT.closePreview(); else closeModal() } });

    /* ========== boot ========== */
    (async function () {
      if (CLOUD) {
        // Cloud mode: check session, load db from server
        // First check if master admin session exists in sessionStorage
        if (getMasterSess()) {
          try {
            let d = await loadDbCloud();
            if (d) { db = d; db.settings = db.settings || {}; db.settings.bank = db.settings.bank || {};['customers', 'products', 'items', 'quotes', 'users', 'companies', 'profiles'].forEach(k => db[k] = db[k] || []); db.seq = db.seq || {}; }
            else db = seedData();
          } catch (ex) { db = seedData(); }
          me = { id: 'master', name: 'Master Admin', username: 'master', role: 'master', active: true };
          applyThemeColors();
          renderApp();
          return;
        }
        // Step 1: Load public init data (company name, theme) - works without auth
        try {
          const init = await fetch('/api/init').then(r => r.json());
          // Build a minimal db skeleton for the login screen
          db = { settings: { company: init.company || '', accentColor: init.accentColor || '', headerColor: init.headerColor || '', bank: {} }, customers: [], products: [], items: [], quotes: [], users: init.hasUsers ? [{ id: '__placeholder__' }] : [], companies: [], profiles: [], seq: {} };
        } catch (e) {
          // Server not reachable - try local storage
          console.warn('[QuoteDesk] Server not reachable, checking local cache:', e);
          const localDb = loadDbLocal();
          if (localDb) {
            db = localDb;
            db.settings = db.settings || {}; db.settings.bank = db.settings.bank || {};
            ['customers', 'products', 'items', 'quotes', 'users', 'companies', 'profiles'].forEach(k => db[k] = db[k] || []); db.seq = db.seq || {};
          } else {
            db = null;
          }
        }
        // Step 2: Check session - if logged in, load the full DB
        try {
          const m = await apiGet('/api/me');
          if (m && m.userId) {
            // User is logged in - load the full database
            try {
              const fullDb = await loadDbCloud();
              if (fullDb) {
                db = fullDb;
                db.settings = db.settings || {}; db.settings.bank = db.settings.bank || {};
                ['customers', 'products', 'items', 'quotes', 'users', 'companies', 'profiles'].forEach(k => db[k] = db[k] || []); db.seq = db.seq || {};
              }
            } catch (ex) { console.warn('[QuoteDesk] Could not load full DB:', ex); }
            if (m.userId === 'master') {
              me = { id: 'master', name: 'Master Admin', username: 'master', role: 'master', active: true };
              setMasterSess(true);
            } else {
              me = (db && db.users) ? db.users.find(u => u.id === m.userId && u.active) || null : null;
            }
          } else {
            me = null;
          }
        } catch (e) {
          // Not logged in - that's fine, show login screen
          me = null;
        }
      } else {
        // Local mode: load from localStorage
        db = loadDbLocal();
        if (db) {
          db.settings = db.settings || {}; db.settings.bank = db.settings.bank || {};
          ['customers', 'products', 'items', 'quotes', 'users', 'companies', 'profiles'].forEach(k => db[k] = db[k] || []); db.seq = db.seq || {};
          const sid = getSess();
          if (sid) me = db.users.find(u => u.id === sid && u.active) || null;
        }
      }
      applyThemeColors();
      renderApp();
    })();

  </script>
</body>

</html>
